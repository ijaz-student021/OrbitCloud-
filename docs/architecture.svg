<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arr-1B1F3B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1B1F3B"/></marker><marker id="arrs-1B1F3B" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#1B1F3B"/></marker><marker id="arr-3B3FD8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3B3FD8"/></marker><marker id="arrs-3B3FD8" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#3B3FD8"/></marker><marker id="arr-0B8F7F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0B8F7F"/></marker><marker id="arrs-0B8F7F" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0B8F7F"/></marker><marker id="arr-B45309" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B45309"/></marker><marker id="arrs-B45309" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#B45309"/></marker><marker id="arr-5B6178" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5B6178"/></marker><marker id="arrs-5B6178" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#5B6178"/></marker></defs><rect width="1600" height="1110" fill="#ffffff"/>
<text x="40" y="56" font-size="32" font-weight="800" fill="#3B3FD8" text-anchor="start" >ORBIT CLOUD</text><text x="292" y="56" font-size="24" font-weight="400" fill="#1B1F3B" text-anchor="start" >System architecture — how the cloud works</text>
<text x="40" y="86" font-size="15" font-weight="400" fill="#5B6178" text-anchor="start" >A private cloud for storing files: ADD · UPDATE · DOWNLOAD · DELETE from home, office or mobile, over encrypted HTTPS.</text>
<rect x="40" y="120" width="970" height="150" rx="14" fill="#F5F6FA" stroke="#C9CDE0" stroke-width="1.5"/>
<text x="60" y="146" font-size="12.5" font-weight="700" fill="#5B6178" text-anchor="start" letter-spacing="0.8">CLIENTS  —  the people who use the cloud</text>
<rect x="60" y="160" width="290" height="90" rx="12" fill="#fff" stroke="#C9CDE0" stroke-width="1.5"/>
<text x="78" y="214" font-size="34" font-weight="400" fill="#1B1F3B" text-anchor="start" >🏠</text>
<text x="132" y="192" font-size="17" font-weight="700" fill="#1B1F3B" text-anchor="start" >Home</text>
<text x="132" y="214" font-size="13" font-weight="400" fill="#1B1F3B" text-anchor="start" >Laptop or phone</text>
<text x="132" y="233" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="start" >Web browser · desktop app</text>
<rect x="375" y="160" width="290" height="90" rx="12" fill="#fff" stroke="#C9CDE0" stroke-width="1.5"/>
<text x="393" y="214" font-size="34" font-weight="400" fill="#1B1F3B" text-anchor="start" >🏢</text>
<text x="447" y="192" font-size="17" font-weight="700" fill="#1B1F3B" text-anchor="start" >Office</text>
<text x="447" y="214" font-size="13" font-weight="400" fill="#1B1F3B" text-anchor="start" >Desktop PC</text>
<text x="447" y="233" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="start" >Web browser · sync client</text>
<rect x="690" y="160" width="290" height="90" rx="12" fill="#fff" stroke="#C9CDE0" stroke-width="1.5"/>
<text x="708" y="214" font-size="34" font-weight="400" fill="#1B1F3B" text-anchor="start" >📱</text>
<text x="762" y="192" font-size="17" font-weight="700" fill="#1B1F3B" text-anchor="start" >On the move</text>
<text x="762" y="214" font-size="13" font-weight="400" fill="#1B1F3B" text-anchor="start" >Mobile / tablet</text>
<text x="762" y="233" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="start" >Nextcloud app (WebDAV)</text>
<line x1="205" y1="250" x2="205" y2="298" stroke="#3B3FD8" stroke-width="2.2" marker-end="url(#arr-3B3FD8)"/>
<line x1="520" y1="250" x2="520" y2="298" stroke="#3B3FD8" stroke-width="2.2" marker-end="url(#arr-3B3FD8)"/>
<line x1="835" y1="250" x2="835" y2="298" stroke="#3B3FD8" stroke-width="2.2" marker-end="url(#arr-3B3FD8)"/>
<rect x="40" y="300" width="970" height="72" rx="36" fill="#EAECF4" stroke="#B9BED6" stroke-width="1.5"/>
<text x="525" y="330" font-size="15" font-weight="700" fill="#1B1F3B" text-anchor="middle" >NETWORK  —  home Wi-Fi · office LAN · Internet (VPN / tunnel)</text>
<text x="525" y="354" font-size="13" font-weight="400" fill="#5B6178" text-anchor="middle" >every request is encrypted with HTTPS (TLS) and enters through ONE port: 8443</text>
<circle cx="545" cy="275" r="13" fill="#3B3FD8"/><text x="545" y="280" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >1</text>
<rect x="40" y="412" width="1010" height="640" rx="16" fill="#FBFBFF" stroke="#3B3FD8" stroke-width="2.5"/>
<text x="545" y="438" font-size="14" font-weight="700" fill="#3B3FD8" text-anchor="middle" >PROVIDER'S SERVER  —  your computer + Docker  (virtualisation = IaaS layer)</text>
<rect x="60" y="452" width="970" height="560" rx="12" fill="none" stroke="#8A90B0" stroke-width="1.6" stroke-dasharray="7 6"/>
<text x="1018" y="474" font-size="12" font-weight="400" fill="#5B6178" text-anchor="end" >private network  orbit-net · 172.30.77.0/24  —  not reachable from outside</text>
<line x1="205" y1="372" x2="205" y2="508" stroke="#3B3FD8" stroke-width="2.2" marker-end="url(#arr-3B3FD8)"/>
<circle cx="228" cy="400" r="13" fill="#3B3FD8"/><text x="228" y="405" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >2</text>
<text x="248" y="405" font-size="12" font-weight="700" fill="#3B3FD8" text-anchor="start" >HTTPS</text>
<rect x="80" y="510" width="250" height="190" rx="12" fill="#fff" stroke="#3B3FD8" stroke-width="2"/>
<path d="M80 522 a12 12 0 0 1 12 -12 h226 a12 12 0 0 1 12 12 v22 h-250 z" fill="#3B3FD8"/>
<text x="94" y="533" font-size="13.5" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0.4">GATEWAY  ·  orbit-gateway</text>
<text x="94" y="568" font-size="13" font-weight="700" fill="#1B1F3B" text-anchor="start" >Caddy 2  (reverse proxy)</text>
<text x="94" y="590" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="start" >• Terminates HTTPS / TLS</text>
<text x="94" y="610" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="start" >• Certificate from private CA</text>
<text x="94" y="630" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="start" >• Checks the host name</text>
<text x="94" y="650" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="start" >• Forwards to the app</text>
<text x="94" y="670" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="start" >• Only published port: 8443</text>
<rect x="400" y="496" width="340" height="250" rx="12" fill="#fff" stroke="#3B3FD8" stroke-width="2"/>
<path d="M400 508 a12 12 0 0 1 12 -12 h316 a12 12 0 0 1 12 12 v22 h-340 z" fill="#3B3FD8"/>
<text x="414" y="519" font-size="13.5" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0.4">APPLICATION  ·  orbit-app   (SaaS)</text>
<text x="414" y="554" font-size="13" font-weight="700" fill="#1B1F3B" text-anchor="start" >Nextcloud 34  (Apache + PHP)</text>
<text x="414" y="576" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="start" >• Web portal + WebDAV file API</text>
<text x="414" y="596" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="start" >• Login, sessions, brute-force guard</text>
<text x="414" y="616" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="start" >• ADD · UPDATE · DOWNLOAD · DELETE</text>
<text x="414" y="636" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="start" >• Sharing &amp; permissions</text>
<text x="414" y="656" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="start" >• Versions + trash bin (undo)</text>
<text x="414" y="676" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="start" >• Per-client storage quota (metering)</text>
<rect x="80" y="752" width="250" height="100" rx="12" fill="#fff" stroke="#3B3FD8" stroke-width="2"/>
<path d="M80 764 a12 12 0 0 1 12 -12 h226 a12 12 0 0 1 12 12 v22 h-250 z" fill="#3B3FD8"/>
<text x="94" y="775" font-size="13.5" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0.4">WORKER  ·  orbit-cron</text>
<text x="94" y="810" font-size="13" font-weight="700" fill="#1B1F3B" text-anchor="start" >Background jobs</text>
<text x="94" y="832" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="start" >clean-up · trash expiry · indexing</text>
<rect x="800" y="496" width="210" height="170" rx="12" fill="#fff" stroke="#0B8F7F" stroke-width="2"/>
<path d="M800 508 a12 12 0 0 1 12 -12 h186 a12 12 0 0 1 12 12 v22 h-210 z" fill="#0B8F7F"/>
<text x="814" y="519" font-size="13.5" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0.4">DATABASE  ·  orbit-db</text>
<text x="814" y="554" font-size="13" font-weight="700" fill="#1B1F3B" text-anchor="start" >PostgreSQL 17</text>
<text x="814" y="576" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="start" >• users &amp; password hashes</text>
<text x="814" y="596" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="start" >• file index / metadata</text>
<text x="814" y="616" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="start" >• shares, quotas</text>
<text x="814" y="636" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="start" >volume: orbit_db</text>
<rect x="800" y="696" width="210" height="130" rx="12" fill="#fff" stroke="#0B8F7F" stroke-width="2"/>
<path d="M800 708 a12 12 0 0 1 12 -12 h186 a12 12 0 0 1 12 12 v22 h-210 z" fill="#0B8F7F"/>
<text x="814" y="719" font-size="13.5" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0.4">CACHE  ·  orbit-cache</text>
<text x="814" y="754" font-size="13" font-weight="700" fill="#1B1F3B" text-anchor="start" >Redis 7</text>
<text x="814" y="776" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="start" >• file locks (no clashes)</text>
<text x="814" y="796" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="start" >• fast session cache</text>
<path d="M440 822 v118 a130.0 16 0 0 0 260 0 v-118" fill="#E1F5F2" stroke="#0B8F7F" stroke-width="2"/>
<ellipse cx="570.0" cy="822" rx="130.0" ry="16" fill="#E1F5F2" stroke="#0B8F7F" stroke-width="2"/>
<text x="570" y="862" font-size="14" font-weight="700" fill="#0B8F7F" text-anchor="middle" letter-spacing="0.6">FILE STORAGE</text>
<text x="570" y="884" font-size="13" font-weight="700" fill="#1B1F3B" text-anchor="middle" >Docker volume  orbit_data</text>
<text x="570" y="905" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="middle" >documents · photos · versions · trash</text>
<line x1="330" y1="612" x2="398" y2="612" stroke="#3B3FD8" stroke-width="2.2" marker-end="url(#arr-3B3FD8)"/>
<circle cx="364" cy="590" r="13" fill="#3B3FD8"/><text x="364" y="595" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >3</text>
<line x1="742" y1="560" x2="798" y2="560" stroke="#0B8F7F" stroke-width="2.2" marker-end="url(#arr-0B8F7F)" marker-start="url(#arrs-0B8F7F)"/>
<circle cx="770" cy="538" r="13" fill="#0B8F7F"/><text x="770" y="543" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >4</text>
<line x1="742" y1="730" x2="798" y2="730" stroke="#0B8F7F" stroke-width="2.2" marker-end="url(#arr-0B8F7F)" marker-start="url(#arrs-0B8F7F)"/>
<line x1="570" y1="748" x2="570" y2="804" stroke="#0B8F7F" stroke-width="2.2" marker-end="url(#arr-0B8F7F)" marker-start="url(#arrs-0B8F7F)"/>
<circle cx="594" cy="778" r="13" fill="#0B8F7F"/><text x="594" y="783" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >5</text>
<line x1="330" y1="810" x2="442" y2="880" stroke="#0B8F7F" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arr-0B8F7F)"/>
<text x="340" y="874" font-size="11.5" font-weight="400" fill="#5B6178" text-anchor="start" >housekeeping</text>
<text x="545" y="1034" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="middle" >Docker volumes keep the data safe when containers restart:  orbit_data · orbit_db · orbit_html</text>
<rect x="1120" y="120" width="440" height="292" rx="14" fill="#fff" stroke="#C9CDE0" stroke-width="1.5"/>
<text x="1140" y="146" font-size="12.5" font-weight="700" fill="#5B6178" text-anchor="start" letter-spacing="0.6">WHAT HAPPENS ON ONE REQUEST   (e.g. upload report.pdf)</text>
<circle cx="1148" cy="169" r="13" fill="#3B3FD8"/><text x="1148" y="174" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >1</text>
<text x="1172" y="174" font-size="12.8" font-weight="400" fill="#1B1F3B" text-anchor="start" >The client (browser / app) sends the request</text>
<text x="1172" y="190" font-size="12.8" font-weight="400" fill="#1B1F3B" text-anchor="start" >and the user's login.</text>
<circle cx="1148" cy="213" r="13" fill="#3B3FD8"/><text x="1148" y="218" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >2</text>
<text x="1172" y="218" font-size="12.8" font-weight="400" fill="#1B1F3B" text-anchor="start" >It crosses Wi-Fi / LAN / Internet, encrypted (TLS),</text>
<text x="1172" y="234" font-size="12.8" font-weight="400" fill="#1B1F3B" text-anchor="start" >and reaches the gateway.</text>
<circle cx="1148" cy="257" r="13" fill="#3B3FD8"/><text x="1148" y="262" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >3</text>
<text x="1172" y="262" font-size="12.8" font-weight="400" fill="#1B1F3B" text-anchor="start" >The gateway decrypts it and forwards it to the</text>
<text x="1172" y="278" font-size="12.8" font-weight="400" fill="#1B1F3B" text-anchor="start" >app inside the private network.</text>
<circle cx="1148" cy="301" r="13" fill="#0B8F7F"/><text x="1148" y="306" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >4</text>
<text x="1172" y="306" font-size="12.8" font-weight="400" fill="#1B1F3B" text-anchor="start" >The app checks login, permission and quota</text>
<text x="1172" y="322" font-size="12.8" font-weight="400" fill="#1B1F3B" text-anchor="start" >(PostgreSQL) and locks the file (Redis).</text>
<circle cx="1148" cy="345" r="13" fill="#0B8F7F"/><text x="1148" y="350" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >5</text>
<text x="1172" y="350" font-size="12.8" font-weight="400" fill="#1B1F3B" text-anchor="start" >The app reads / writes / deletes the file in the</text>
<text x="1172" y="366" font-size="12.8" font-weight="400" fill="#1B1F3B" text-anchor="start" >data volume; versions &amp; trash keep the old copy.</text>
<circle cx="1148" cy="389" r="13" fill="#3B3FD8"/><text x="1148" y="394" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >6</text>
<text x="1172" y="394" font-size="12.8" font-weight="400" fill="#1B1F3B" text-anchor="start" >The answer (201 / 204 / 200) returns the same way.</text>
<rect x="1120" y="442" width="440" height="206" rx="14" fill="#FDF1E3" stroke="#B45309" stroke-width="2"/>
<text x="1140" y="470" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="start" letter-spacing="0.6">PROVIDER / ADMINISTRATOR  —  the cloud operator</text>
<text x="1140" y="502" font-size="12.8" font-weight="400" fill="#1B1F3B" text-anchor="start" >• Admin web portal: create clients, set quotas, install apps</text>
<text x="1140" y="528" font-size="12.8" font-weight="400" fill="#1B1F3B" text-anchor="start" >• ./orbit up · down · status · test · backup</text>
<text x="1140" y="554" font-size="12.8" font-weight="400" fill="#1B1F3B" text-anchor="start" >• occ command line for automation &amp; maintenance</text>
<text x="1140" y="580" font-size="12.8" font-weight="400" fill="#1B1F3B" text-anchor="start" >• Clients are isolated: each sees only their own files</text>
<text x="1140" y="606" font-size="12.8" font-weight="400" fill="#1B1F3B" text-anchor="start" >• Secrets live in .env (permissions 600), never in code</text>
<line x1="1120" y1="545" x2="1052" y2="545" stroke="#B45309" stroke-width="2.2" marker-end="url(#arr-B45309)"/>
<text x="1086" y="534" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle" >manages</text>
<rect x="1120" y="680" width="440" height="206" rx="14" fill="#fff" stroke="#B45309" stroke-width="2"/>
<text x="1140" y="708" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="start" letter-spacing="0.6">BACKUP SERVICE   ./orbit backup  ·  ./orbit restore</text>
<text x="1140" y="740" font-size="12.8" font-weight="400" fill="#1B1F3B" text-anchor="start" >1  pause writes (maintenance mode)</text>
<text x="1140" y="768" font-size="12.8" font-weight="400" fill="#1B1F3B" text-anchor="start" >2  pg_dump the database  →  database.dump</text>
<text x="1140" y="796" font-size="12.8" font-weight="400" fill="#1B1F3B" text-anchor="start" >3  archive all files  →  files.tar.gz</text>
<text x="1140" y="824" font-size="12.8" font-weight="400" fill="#1B1F3B" text-anchor="start" >4  checksums  →  SHA256SUMS (verified on restore)</text>
<text x="1140" y="852" font-size="12.8" font-weight="700" fill="#B45309" text-anchor="start" >Saved in  backups/&lt;date-time&gt;/  — disaster recovery</text>
<line x1="1052" y1="783" x2="1120" y2="783" stroke="#B45309" stroke-width="2.2" marker-end="url(#arr-B45309)" marker-start="url(#arrs-B45309)"/>
<text x="1086" y="772" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle" >backup</text>
<rect x="60" y="1072" width="16" height="16" rx="4" fill="#3B3FD8"/>
<text x="84" y="1085" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="start" >Access &amp; application layer</text>
<rect x="300" y="1072" width="16" height="16" rx="4" fill="#0B8F7F"/>
<text x="324" y="1085" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="start" >Data layer (stateful)</text>
<rect x="540" y="1072" width="16" height="16" rx="4" fill="#B45309"/>
<text x="564" y="1085" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="start" >Provider operations</text>
<text x="1560" y="1085" font-size="12.5" font-weight="400" fill="#5B6178" text-anchor="end" >Cloud model:  SaaS (Nextcloud)  ·  IaaS (Docker host, network, volumes)  ·  DBaaS (PostgreSQL)</text>
</svg>